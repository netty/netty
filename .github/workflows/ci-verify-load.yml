name: Verify native library loading

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

# Cancel running jobs when a new push happens to the same branch as otherwise it will
# tie up too many resources without providing much value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-jars-linux-aarch64:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write  # to push the docker build cache to ghcr.io; no-op (ignored) for fork PRs
    env:
      # Route `docker compose build` through `docker buildx bake` so the cache_from/cache_to
      # entries in docker/docker-compose.centos-7.cross.yaml are actually honored.
      COMPOSE_BAKE: "true"
    steps:
      # Pinned to v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Caching of maven dependencies
      # Pinned to v5.1.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            cache-maven-${{ hashFiles('**/pom.xml') }}
            cache-maven-

      # The default "docker" buildx driver can't export cache to a registry; switch to the
      # docker-container driver so cache_to: type=registry in the compose file actually works.
      # Pinned to v4.4.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # Only succeeds for same-repo runs; fork PRs get a read-only GITHUB_TOKEN and simply won't
      # get cache hits/pushes, which is fine since it only means a slower, non-cached build.
      # Pinned to v4.6.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        run: docker compose -f docker/docker-compose.centos-7.cross.yaml build

      - name: Build project and install jars
        run: docker compose -f docker/docker-compose.centos-7.cross.yaml run cross-compile-aarch64-install

      # Pinned to v6.0.0
      - name: Upload the maven repository
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: maven-repository
          # We only need the netty jars.
          path: ~/.m2/repository/io/netty/
          if-no-files-found: error

  load-native-linux-aarch64:
    # The host should always be Linux
    runs-on: ubuntu-22.04
    needs: [ install-jars-linux-aarch64 ]
    steps:
      # Pinned to v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Pinned to v7.0.0
      - name: Download the maven repository
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name:  maven-repository
          path: /home/runner/jars

      - uses: uraimo/run-on-arch-action@v3
        name: Check native loading
        id: runcmd
        with:
          arch: aarch64
          distro: ubuntu20.04

          # Not required, but speeds up builds by storing container images in
          # a GitHub package registry.
          githubToken: ${{ github.token }}

          # Mount the .m2/repository
          dockerRunArgs: |
            --volume "/home/runner/jars:/root/jars"

          # Install dependencies
          install: |
            apt-get update -q -y
            apt-get install -q -y openjdk-11-jdk
            apt-get clean -q -y

          # Check if we can load the native code on aarch64
          run: |
            .github/scripts/check_load_native.sh /root/jars io.netty.handler.codec.quic.Quic ensureAvailability

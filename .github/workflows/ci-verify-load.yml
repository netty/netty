# The native libraries of all targets are cross compiled on linux x86_64 (docker/Dockerfile.cross_compile), so
# nothing in that build runs them. These jobs load them on every target, with all native jars on the classpath, like
# an application that depends on all of them would.
name: Verify native library loading

on:
  push:
    branches: [ "4.2" ]

  pull_request:
    branches: [ "4.2" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: read-all

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

# Cancel running jobs when a new push happens to the same branch as otherwise it will
# tie up too many resources without providing much value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-jars:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write  # to push the docker build cache to ghcr.io; no-op (ignored) for fork PRs
    env:
      # Route `docker compose build` through `docker buildx bake` so the cache_from/cache_to
      # entries in the docker-compose*.yaml files are actually honored.
      COMPOSE_BAKE: "true"
    steps:
      # Pinned to v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Pinned to v5.1.0
      - name: Cache local Maven repository
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            cache-maven-${{ hashFiles('**/pom.xml') }}
            cache-maven-

      - name: Delete old netty artifacts in local maven repository
        run: rm -rf ~/.m2/repository/io/netty/*

      # The default "docker" buildx driver can't export cache to a registry; switch to the
      # docker-container driver so cache_to: type=registry in the compose files actually works.
      # Pinned to v4.4.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # Only succeeds for same-repo runs; fork PRs get a read-only GITHUB_TOKEN and simply won't
      # get cache hits/pushes, which is fine since it only means a slower, non-cached build.
      # Pinned to v4.6.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        run: docker compose -f docker/docker-compose.cross.yaml build

      - name: Build the native jars of all targets
        run: docker compose -f docker/docker-compose.cross.yaml run cross-compile-all-install-native

      # Pinned to v6.0.0
      - name: Upload the netty jars
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: netty-jars
          path: ~/.m2/repository/io/netty/
          if-no-files-found: error

  load-native:
    needs: build-jars
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
            checks: epoll io_uring quic
          - target: linux-aarch_64
            os: ubuntu-24.04-arm
            checks: epoll io_uring quic
          - target: osx-x86_64
            os: macos-15-intel
            checks: kqueue dns-macos quic
          - target: osx-aarch_64
            os: macos-15
            checks: kqueue dns-macos quic
          - target: windows-x86_64
            os: windows-2022
            checks: quic
    runs-on: ${{ matrix.os }}
    name: load-native-${{ matrix.target }}
    steps:
      # Pinned to v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Pinned to v7.0.0
      - name: Download the netty jars
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: netty-jars
          path: ${{ runner.temp }}/jars

      # Pinned to v5.7.0
      - name: Set up JDK 11
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Load the native libraries
        shell: bash
        run: .github/scripts/check_load_natives.sh "${{ runner.temp }}/jars" ${{ matrix.checks }}

  # There are no riscv64 runners, so run it in QEMU, like ci-build-riscv64.yml. The glibc of ubuntu 20.04 (2.31) is
  # also the oldest one we support on riscv64.
  load-native-linux-riscv64:
    needs: build-jars
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # for uraimo/run-on-arch-action to cache docker images
    steps:
      # Pinned to v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Pinned to v7.0.0
      - name: Download the netty jars
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: netty-jars
          path: /home/runner/jars

      - uses: uraimo/run-on-arch-action@v3
        name: Load the native libraries
        with:
          arch: riscv64
          distro: ubuntu20.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "/home/runner/jars:/root/jars"
          install: |
            apt-get update -q -y
            apt-get install -q -y openjdk-11-jdk-headless
            apt-get clean -q -y
          run: |
            .github/scripts/check_load_natives.sh /root/jars epoll io_uring

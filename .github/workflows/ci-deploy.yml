name: Deploy project

on:
  push:
    branches: [ "4.2" ]

  schedule:
    - cron: '30 1 * * 1'  # At 01:30 on Monday, every Monday.

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: read-all

env:
  MAVEN_OPTS: -Xmx6g -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

# Cancel running jobs when a new push happens to the same branch as otherwise it will
# tie up too many resources without providing much value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole project, with the native libraries of all targets, is built in one maven build in the cross compile
  # docker image, see docker/Dockerfile.cross_compile and the cross-compile-all profiles of the native modules.
  stage-snapshot:
    runs-on: ubuntu-22.04
    name: stage-snapshot
    env:
      # Route `docker compose build` through `docker buildx bake` so the cache_from/cache_to
      # entries in the docker-compose*.yaml files are actually honored.
      COMPOSE_BAKE: "true"
    steps:
      # Pinned to v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Cache .m2/repository
      # Pinned to v5.1.0
      - name: Cache local Maven repository
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            cache-maven-${{ hashFiles('**/pom.xml') }}
            cache-maven-

      - name: Create local staging directory
        run: mkdir -p ~/local-staging

      # The default "docker" buildx driver can't export cache to a registry; switch to the
      # docker-container driver so cache_to: type=registry in the compose files actually works.
      # Pinned to v4.4.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # This workflow's token only has read-all permissions, so the cache push below will fail;
      # ignore-error=true on cache_to in the compose files absorbs that. Cache reads (populated by
      # ci-build.yml/ci-pr.yml) still work since read-all grants packages: read.
      # Pinned to v4.6.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image
        run: docker compose -f docker/docker-compose.cross.yaml build

      - name: Stage snapshots to local staging directory
        run: docker compose -f docker/docker-compose.cross.yaml run cross-compile-all-stage-snapshot

      # Pinned to v6.0.0
      - name: Upload local staging directory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: local-staging
          path: ~/local-staging
          if-no-files-found: error
          include-hidden-files: true

  deploy-staged-snapshots:
    runs-on: ubuntu-22.04
    # Wait until we have staged everything
    needs: [ stage-snapshot ]
    steps:
      # Pinned to v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Pinned to v5.7.0
      - name: Set up JDK 11
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'zulu'
          java-version: '11'

      # Cache .m2/repository
      # Pinned to v5.1.0
      - name: Cache local Maven repository
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            cache-maven-${{ hashFiles('**/pom.xml') }}
            cache-maven-

      # Pinned to v4.0.0
      - uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788
        with:
          servers: |
            [{
              "id": "central-portal-snapshots",
              "username": "${{ secrets.MAVEN_CENTRAL_USERNAME }}",
              "password": "${{ secrets.MAVEN_CENTRAL_PASSWORD }}"
            }]

      # Pinned to v7.0.0
      - name: Download local staging directory
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: local-staging
          path: ~/local-staging

      - name: Deploy local staged artifacts
        run: ./mvnw -B -ntp --file pom.xml org.sonatype.plugins:nexus-staging-maven-plugin:deploy-staged -DaltStagingDirectory=$HOME/local-staging -DserverId=central-portal-snapshots
